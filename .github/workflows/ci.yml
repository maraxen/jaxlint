name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (dev tooling)
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check src tests

      - name: Smoke tests
        run: uv run pytest -q -m smoke

      - name: Full suite + coverage (main branch pushes only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: uv run pytest -q --cov=jaxlint --cov-report=term-missing --cov-report=xml

      - name: Upload coverage.xml
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync docs dependencies
        run: uv sync --extra docs

      - name: Sphinx HTML (warnings are errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Sphinx linkcheck
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck

