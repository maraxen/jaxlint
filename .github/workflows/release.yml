# Publish wheels/sdist to PyPI from annotated version tags.
#
# Trusted Publishing (OIDC): PyPI pending publisher must match this repo + workflow file.
# If PyPI is configured with GitHub Environment **pypi**, this job must set `environment: pypi`
# so the OIDC token includes that claim (otherwise PyPI sees `environment: MISSING`).
#
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Sync (build tooling)
        run: uv sync --all-groups

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Twine check
        run: uv run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing: PyPI project **jaxlint** ← GitHub **maraxen/jaxlint**
