[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxlint"
version = "0.1.0a1"
description = "CLI and library for JAX-oriented static checks, docstring quality, and optional HLO analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Marielle Russo", email = "67157875+maraxen@users.noreply.github.com" },
]
keywords = ["jax", "lint", "docstring", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "griffe>=2.0.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/maraxen/jaxlint"
Documentation = "https://jaxlint.readthedocs.io/"
Repository = "https://github.com/maraxen/jaxlint"
Issues = "https://github.com/maraxen/jaxlint/issues"
Changelog = "https://jaxlint.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
docs = [
    "sphinx==8.2.3",
    "sphinx-book-theme==1.1.4",
    "myst-parser==4.0.1",
    "sphinx-copybutton==0.5.2",
]
hlo = [
    "jax>=0.4.30",
]
lsp = [
    "pygls>=2.0.0,<3",
]
mcp = [
    "mcp>=1.8.0",
]
# `jaxlint plugin install|update|export|info` -- cisternal's shared plugin sub-app
# (same surface as `bth plugin`, `mrx plugin`, `myxcel plugin`). Optional so the
# PyPI install of the linter does not pull the agent-plugin toolchain. cisternal
# requires Python >= 3.13; on 3.11/3.12 the extra is empty and `jaxlint plugin`
# exits with an explanation.
plugin = [
    "cisternal>=0.1.1a15; python_version >= '3.13'",
]

[project.scripts]
jaxlint = "jaxlint.cli.main:app"
jaxlint-lsp = "jaxlint.lsp.__main__:main"
jaxlint-mcp = "jaxlint.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxlint"]

[tool.hatch.build.targets.wheel.force-include]
"agent_assets" = "jaxlint/agent_assets"

[tool.ruff]
line-length = 100
target-version = "py311"

# Astral ty — static typing (https://docs.astral.sh/ty/). CI runs `ty check` on `src/` only.
[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.ty.src]
include = ["src"]
respect-ignore-files = true

# Optional-extra boundary modules, where an import is unresolvable in some envs by design:
# - jaxlint.hlo imports jax (`hlo` extra). lint-test installs lsp + mcp but not hlo; the
#   merge-blocking `jax-hlo` job covers that package with JAX installed.
# - mcp/server.py imports mcp 2.x (MCPServer) with a 1.x fallback (FastMCP); only one
#   resolves in any env (1.x on Python < 3.13, 2.x on >= 3.13 via the `plugin` extra).
# - cli/plugin_command.py imports cisternal lazily (`plugin` extra, Python >= 3.13 only).
[[tool.ty.overrides]]
include = [
    "src/jaxlint/hlo/**",
    "src/jaxlint/mcp/server.py",
    "src/jaxlint/cli/plugin_command.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout_func_only = true
markers = [
    "smoke: Fast checks for PR CI (imports + minimal CLI)",
    "unit: Focused checks on parsers, sensors, or helpers without full orchestration",
    "integration: run_checks(), Typer invocation, multi-subsystem flows",
    "slow: Heavier workloads (skipped in quick local runs)",
    "needs_jax: Requires jax / jaxlint[hlo] extras",
    "lsp: Language server tests (requires jaxlint[lsp])",
    "mcp: MCP server tests (requires jaxlint[mcp])",
]

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "twine>=6.0.0",
    "ty>=0.0.34",
]

[tool.coverage.run]
source_pkgs = ["jaxlint"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
fail_under = 71
