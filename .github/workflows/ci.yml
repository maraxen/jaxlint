name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (dev tooling)
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check src tests

      - name: Smoke tests
        run: uv run pytest -q -m smoke

      - name: Full suite + coverage (main branch pushes only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: uv run pytest -q --cov=jaxlint --cov-report=term-missing --cov-report=xml

      - name: Upload coverage.xml
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  # Roadmap CI parity (needs_jax): install jaxlint[hlo] and run JAX-marked tests.
  # Required — failures block merge. Developers can skip JAX locally; this job enforces it in CI.
  jax-hlo:
    name: JAX / HLO (needs_jax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync with dev tooling and HLO extra
        run: uv sync --all-groups --extra hlo

      # Pin jax/jaxlib so needs_jax golden expectations and export output stay reproducible across resolver drift.
      - name: Pin JAX stack for CI
        run: uv pip install 'jax==0.10.0' 'jaxlib==0.10.0'

      - name: pytest (needs_jax only)
        run: uv run pytest -q -m needs_jax

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync docs dependencies
        run: uv sync --extra docs

      - name: Sphinx HTML (warnings are errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Sphinx linkcheck
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck

