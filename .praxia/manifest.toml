[plugin]
name            = "jaxlint"
version         = "0.4.0"
description     = "JAX/Equinox linting and usage guidance"
requires_praxia = ">=1.0"

[plugin.mcp]
command = ["jaxlint", "serve"]

[[plugin.skills]]
name     = "using-jaxlint"
path     = "agent_assets/skills/using-jaxlint/SKILL.md"
triggers = ["jaxlint", "lint", "jax rule"]

[[plugin.skills]]
name     = "using-jax"
path     = "agent_assets/skills/using-jax/SKILL.md"
triggers = ["tracer error", "jit", "vmap", "NaN", "recompile"]

[[plugin.skills]]
name     = "using-equinox"
path     = "agent_assets/skills/using-equinox/SKILL.md"
triggers = ["eqx.Module", "filter_jit", "filter_grad"]

[[plugin.skills]]
name     = "jax-debugging"
path     = "agent_assets/skills/jax-debugging/SKILL.md"
triggers = ["nan", "inf", "gradient explosion", "shape mismatch"]

[[plugin.skills]]
name     = "jax-performance"
path     = "agent_assets/skills/jax-performance/SKILL.md"
triggers = ["slow", "recompile", "tracing overhead", "XLA"]

[[plugin.skills]]
name     = "equinox-patterns"
path     = "agent_assets/skills/equinox-patterns/SKILL.md"
triggers = ["pytree", "filter", "eqx.tree_at", "partition"]

[[plugin.skills]]
name     = "jax-distributed"
path     = "agent_assets/skills/jax-distributed/SKILL.md"
triggers = ["pmap", "sharding", "mesh", "multi-device"]

[[plugin.snippets]]
name           = "jaxlint-always-on"
path           = "agent_assets/snippets/jaxlint-rules.md"
scope          = "project"
scope_detector = ["glob:pyproject.toml", "toml:pyproject.toml#tool.jaxlint"]

[[plugin.agents]]
name  = "jax-optimizer"
path  = "agent_assets/agents/jax-optimizer.md"
tools = ["jaxlint_check", "jaxlint_rules"]

[plugin.export_command]
claude_code = ["jaxlint", "export", "--surface", "claude_code", "--level", "user"]
