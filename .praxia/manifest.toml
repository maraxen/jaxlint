[plugin]
name            = "jaxlint"
version         = "0.4.3"
description     = "JAX/Equinox linting and usage guidance"
requires_praxia = ">=1.0"

[plugin.mcp]
command = ["jaxlint-mcp"]

[[plugin.skills]]
name     = "using-jaxlint"
path     = "agent_assets/skills/using-jaxlint/SKILL.md"
triggers = ["jaxlint", "lint", "jax rule"]

[[plugin.skills]]
name     = "using-jax"
path     = "agent_assets/skills/using-jax/SKILL.md"
triggers = ["tracer error", "jit", "vmap", "NaN", "recompile"]

[[plugin.skills]]
name     = "using-equinox"
path     = "agent_assets/skills/using-equinox/SKILL.md"
triggers = ["eqx.Module", "filter_jit", "filter_grad"]

[[plugin.skills]]
name     = "developing-composable-jax"
path     = "agent_assets/skills/developing-composable-jax/SKILL.md"
triggers = ["composable-jax", "module-diverging", "branching __call__", "swappable implementation"]

[[plugin.skills]]
name     = "exporting-jax"
path     = "agent_assets/skills/exporting-jax/SKILL.md"
triggers = ["jax.export", "StableHLO", "IREE", "AOT compile"]

[[plugin.skills]]
name     = "using-optax"
path     = "agent_assets/skills/using-optax/SKILL.md"
triggers = ["optax", "GradientTransformation", "learning rate schedule"]

[[plugin.skills]]
name     = "using-orbax"
path     = "agent_assets/skills/using-orbax/SKILL.md"
triggers = ["orbax", "CheckpointManager", "checkpoint restore"]

[[plugin.skills]]
name     = "jax-port"
path     = "agent_assets/skills/jax-port/SKILL.md"
triggers = ["jax-port", "numpy-to-jax", "pytorch-to-jax", "tensorflow-to-jax", "parity-test"]

[[plugin.snippets]]
name           = "jaxlint-always-on"
path           = "agent_assets/snippets/jaxlint-rules.md"
scope          = "project"
scope_detector = ["glob:pyproject.toml", "toml:pyproject.toml#tool.jaxlint"]

[[plugin.agents]]
name  = "jax-optimizer"
path  = "agent_assets/agents/jax-optimizer.md"
tools = ["jaxlint_check", "jaxlint_rules"]

[plugin.export_command]
claude_code = ["jaxlint", "export", "--surface", "claude_code", "--level", "user"]

# PostToolUse hook: after an agent writes or edits a .py file, lint that one file and feed its NEW
# findings back as context (blocking only with `hook-block-on-error = true`). For Claude, cisternal
# treats `script` as a literal command and copies no file, so it must be a PATH console script of
# the jaxlint install. It is a separate stdlib-only entry point (jaxlint.hooks.edit_hook) because it
# runs after every Write/Edit/MultiEdit call; the rule engine is imported only for files that import JAX.
[[plugin.hook_specs]]
event    = "PostToolUse"
matcher  = "Write|Edit|MultiEdit"
script   = "jaxlint-hook"
surfaces = ["claude"]
