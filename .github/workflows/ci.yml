# CI — jaxlint
#
# Docs job (`docs`): runs on every push to `main` / `master`. On `pull_request`, runs only when
# these paths change (frozen glob list for review/audit):
#   - docs/**
#   - docs/conf.py          (covered by docs/**)
#   - docs/roadmap.md        (covered by docs/**)
#   - .readthedocs.yml
#   - README.md
#
# lint-test: every PR/push runs Ruff, ty on src/ ([tool.ty] in pyproject), then full pytest with coverage (same matrix as local release checks).
#
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (dev tooling + LSP + MCP extras)
        run: uv sync --all-groups --extra lsp --extra mcp

      - name: Ruff
        run: uv run ruff check src tests

      - name: ty (Astral type checker)
        run: uv run ty check --output-format github

      - name: Tests + coverage
        run: uv run pytest -q --cov=jaxlint --cov-report=term-missing --cov-report=xml

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  # Roadmap CI parity (needs_jax): install jaxlint[hlo] and run JAX-marked tests.
  # Required — failures block merge. Developers can skip JAX locally; this job enforces it in CI.
  jax-hlo:
    name: JAX / HLO (needs_jax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync with dev tooling and HLO extra
        run: uv sync --all-groups --extra hlo

      # Pin jax/jaxlib so needs_jax golden expectations and export output stay reproducible across resolver drift.
      - name: Pin JAX stack for CI
        run: uv pip install 'jax==0.10.0' 'jaxlib==0.10.0'

      - name: pytest (needs_jax only)
        run: uv run pytest -q -m needs_jax

  # Gate docs work on PRs to docs-related paths; always run on default-branch pushes.
  docs-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '.readthedocs.yml'
              - 'README.md'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.docs }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: docs-should-run
    if: needs.docs-should-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync docs dependencies
        run: uv sync --extra docs

      - name: Sphinx HTML (warnings are errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Sphinx linkcheck
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck

