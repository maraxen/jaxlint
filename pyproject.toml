[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxlint"
version = "0.1.0a1"
description = "CLI and library for JAX-oriented static checks, docstring quality, and optional HLO analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Marielle Russo", email = "67157875+maraxen@users.noreply.github.com" },
]
keywords = ["jax", "lint", "docstring", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "griffe>=2.0.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/maraxen/jaxlint"
Documentation = "https://jaxlint.readthedocs.io/"
Repository = "https://github.com/maraxen/jaxlint"
Issues = "https://github.com/maraxen/jaxlint/issues"
Changelog = "https://jaxlint.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
docs = [
    "sphinx==8.2.3",
    "sphinx-book-theme==1.1.4",
    "myst-parser==4.0.1",
    "sphinx-copybutton==0.5.2",
]
hlo = [
    "jax>=0.4.30",
]
lsp = [
    "pygls>=2.0.0,<3",
]
mcp = [
    "mcp>=1.8.0",
]

[project.scripts]
jaxlint = "jaxlint.cli.main:app"
jaxlint-lsp = "jaxlint.lsp.__main__:main"
jaxlint-mcp = "jaxlint.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxlint"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Astral ty — static typing (https://docs.astral.sh/ty/). CI runs `ty check` on `src/` only.
[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.ty.src]
include = ["src"]
respect-ignore-files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout_func_only = true
markers = [
    "smoke: Fast checks for PR CI (imports + minimal CLI)",
    "unit: Focused checks on parsers, sensors, or helpers without full orchestration",
    "integration: run_checks(), Typer invocation, multi-subsystem flows",
    "slow: Heavier workloads (skipped in quick local runs)",
    "needs_jax: Requires jax / jaxlint[hlo] extras",
    "lsp: Language server tests (requires jaxlint[lsp])",
    "mcp: MCP server tests (requires jaxlint[mcp])",
]

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "twine>=6.0.0",
    "ty>=0.0.34",
]

[tool.coverage.run]
source_pkgs = ["jaxlint"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
fail_under = 71
